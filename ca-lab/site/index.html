<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CA Lab</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e2e0d8;
    --accent: #2f6fdb; --good: #1f9d6b; --warn: #d9822b; --bad: #d64545; --chip: #eeece6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9a9890; --line: #33322e;
      --accent: #5b8ff0; --good: #3cc48f; --warn: #eb9a4a; --bad: #ef6b6b; --chip: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { display: grid; grid-template-columns: 270px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--line); padding: 22px 14px; background: var(--panel); }
  aside h1 { font-size: 18px; margin: 0 0 2px; }
  aside .upd { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .exp { display: block; width: 100%; text-align: left; background: transparent; color: var(--ink); border: 1px solid transparent;
         border-radius: 10px; padding: 10px; margin-bottom: 6px; cursor: pointer; font: inherit; }
  .exp:hover { background: var(--chip); }
  .exp.on { border-color: var(--line); background: var(--chip); }
  .exp .t { font-weight: 600; font-size: 14px; }
  .exp .s { color: var(--muted); font-size: 12px; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; margin-right: 6px; font-weight: 600; }
  .chip.running { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .chip.done { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
  .chip.queued { background: var(--chip); color: var(--muted); }
  main { padding: 26px 24px 60px; max-width: 1180px; }
  h2 { font-size: 22px; margin: 0 0 6px; }
  h3 { font-size: 14px; margin: 0 0 10px; }
  .blurb { color: var(--muted); max-width: 820px; margin-bottom: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .kpi .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi .d { font-size: 12px; color: var(--muted); }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .controls label { color: var(--muted); font-size: 13px; }
  input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
  button.b { font: inherit; background: var(--ink); color: var(--bg); border: 0; border-radius: 8px; padding: 6px 13px; cursor: pointer; }
  .grids { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .grids figure { margin: 0; text-align: center; }
  .grids canvas { width: 100%; image-rendering: pixelated; border-radius: 6px; border: 1px solid var(--line); }
  .grids figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 10px; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  svg text { fill: var(--muted); font-size: 11px; }
  .notes { white-space: pre-wrap; }
  .sb { font: inherit; font-size: 13px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; cursor: pointer; }
  .sb.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  table.ood { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
  table.ood th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.ood td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  .oodrow { cursor: pointer; } .oodrow:hover { background: var(--chip); }
  .okc { color: var(--good); } .badc { color: var(--bad); }
  .rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .empty { color: var(--muted); padding: 60px 0; text-align: center; }
  .mono { font-variant-numeric: tabular-nums; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } .two { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { .grids { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>CA Lab</h1>
    <div class="upd" id="upd">loading…</div>
    <div id="list"></div>
  </aside>
  <main id="main"><div class="empty">Waiting for the first experiment…</div></main>
</div>
<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let manifest = null, current = null, exp = null, expStamp = '', snapIdx = 0, tIdx = 0, playing = true, timer = null, scen = -1;

async function getJSON(u) { const r = await fetch(u + '?t=' + Date.now()); return r.json(); }

async function poll() {
  try {
    manifest = await getJSON('data/manifest.json');
    document.getElementById('upd').textContent = 'Updated ' + manifest.updated + ' · auto-refreshes';
    renderList();
    if (!current && manifest.experiments.length) current = manifest.experiments[manifest.experiments.length - 1].id;
    const m = manifest.experiments.find(e => e.id === current);
    if (m && m.stamp !== expStamp) { await loadExp(m); }
  } catch (e) { document.getElementById('upd').textContent = 'waiting for data…'; }
  setTimeout(poll, 4000);
}

function renderList() {
  document.getElementById('list').innerHTML = manifest.experiments.map(e => `
    <button class="exp ${e.id === current ? 'on' : ''}" data-id="${e.id}">
      <div class="t">${e.title}</div>
      <div class="s"><span class="chip ${e.status}">${e.status}</span>${e.summary || ''}</div>
    </button>`).join('') || '<div class="s" style="color:var(--muted)">No experiments yet.</div>';
  document.querySelectorAll('.exp').forEach(b => b.onclick = async () => {
    current = b.dataset.id; expStamp = ''; renderList();
    await loadExp(manifest.experiments.find(e => e.id === current));
  });
}

async function loadExp(m) {
  const keepLatest = !exp || exp.id !== m.id || snapIdx === exp.snapshots.length - 1;
  exp = await getJSON('data/' + m.file); expStamp = m.stamp;
  if (keepLatest) snapIdx = Math.max(0, exp.snapshots.length - 1);
  snapIdx = Math.min(snapIdx, Math.max(0, exp.snapshots.length - 1));
  renderExp();
}

function fmt(v) { return v == null ? '–' : (Math.abs(v) < 10 ? v.toFixed(3) : v.toFixed(1)); }

function renderExp() {
  const e = exp, main = document.getElementById('main');
  const best = e.history.length ? e.history[e.history.length - 1] : null;
  const kp = [];
  kp.push(`<div class="kpi"><div class="k">Status</div><div class="v">${e.status}</div><div class="d">${e.history.length} generations</div></div>`);
  if (best) kp.push(`<div class="kpi"><div class="k">Model · ${e.metric_name}</div><div class="v">${fmt(best.test)}</div><div class="d">held-out, ${e.higher_is_better ? 'higher' : 'lower'} is better</div></div>`);
  (e.baselines || []).forEach(b => kp.push(`<div class="kpi"><div class="k">${b.name}</div><div class="v">${fmt(b.value)}</div><div class="d">baseline</div></div>`));
  main.innerHTML = `
    <h2>${e.title}</h2>
    <div class="blurb">${e.blurb}</div>
    <div class="panel"><div class="kpis">${kp.join('')}</div></div>
    <div class="panel">
      <h3>Ground truth vs the best evolved rule</h3>
      ${e.ood ? `<div class="controls scen" id="scen">
        <button class="sb ${scen < 0 ? 'on' : ''}" data-i="-1">Held-out (like training)</button>
        ${e.ood.map((o, i) => `<button class="sb ${scen === i ? 'on' : ''}" data-i="${i}">Tweak: ${o.name}</button>`).join('')}
      </div><div class="blurb" id="scendesc" style="margin:0 0 10px"></div>` : ''}
      <div class="controls" id="genrow">
        <label>Generation</label><input type="range" id="gs" min="0" max="${Math.max(0, e.snapshots.length - 1)}" value="${snapIdx}">
        <span class="mono" id="gl"></span>
      </div>
      <div class="controls">
        <button class="b" id="pl">${playing ? 'Pause' : 'Play'}</button>
        <label>Time step</label><input type="range" id="ts" min="0" max="${Math.max(0, (e.frame_times || []).length - 1)}" value="${tIdx}">
        <span class="mono" id="tl"></span>
      </div>
      <div class="grids">
        <figure><canvas id="cT"></canvas><figcaption>Ground truth</figcaption></figure>
        <figure><canvas id="cM"></canvas><figcaption id="cmcap">Evolved CA</figcaption></figure>
        <figure><canvas id="cD"></canvas><figcaption>Disagreement (red = wrong cell)</figcaption></figure>
      </div>
      <div class="legend">${(e.states || []).map(s => `<span><i class="sw" style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>
    </div>
    <div class="two">
      <div class="panel"><h3>Learning curve (${e.metric_name}, held-out)</h3><svg id="lc" viewBox="0 0 520 250" width="100%"></svg><div class="legend" id="lcl"></div></div>
      <div class="panel"><h3 id="cvh">${e.curve_label || 'Population curve'}</h3><svg id="cv" viewBox="0 0 520 250" width="100%"></svg><div class="legend" id="cvl"></div></div>
    </div>
    ${e.ood ? `<div class="panel"><h3>Tweaked starting conditions: does the learned rule generalise?</h3>
      <div class="blurb" style="margin-bottom:10px">The final rule, run on outbreaks that start differently from anything in training. ${e.higher_is_better ? 'Accuracy, higher is better.' : 'District RMSE, lower is better.'} Click a row to watch it above.</div>
      <table class="ood"><tr><th>Starting condition</th><th>Evolved CA</th>${e.ood[0].baselines.map(b => `<th>${b.name}</th>`).join('')}</tr>
      <tr class="oodrow" data-i="-1"><td>Held-out (like training)</td><td><b>${fmt(e.history[e.history.length - 1].test)}</b></td>${e.ood[0].baselines.map(b => { const m = (e.baselines || []).find(x => x.name.startsWith(b.name.split(',')[0])); return `<td>${m ? fmt(m.value) : '–'}</td>`; }).join('')}</tr>
      ${e.ood.map((o, i) => {
        const others = o.baselines.filter(b => !b.name.startsWith('True rule'));
        const bestOther = others.length ? (e.higher_is_better ? Math.max(...others.map(b => b.value)) : Math.min(...others.map(b => b.value))) : null;
        const win = bestOther == null || (e.higher_is_better ? o.test >= bestOther : o.test <= bestOther);
        return `<tr class="oodrow" data-i="${i}"><td>${o.name}</td><td><b class="${win ? 'okc' : 'badc'}">${fmt(o.test)}</b></td>${o.baselines.map(b => `<td>${fmt(b.value)}</td>`).join('')}</tr>`;
      }).join('')}</table></div>` : ''}
    ${e.rule ? `<div class="panel"><h3>What the model learned vs the true rule</h3>
      <div class="blurb" style="margin-bottom:10px">Each chart is one starting state. The x-axis is how many of the 8 neighbours are infectious; the y-axis is the chance of turning into another state next step. Dashed = the hidden true rule, solid = the best evolved rule. Faded dots are situations that almost never occur in the training data, so the model has little evidence there.</div>
      <div class="rules" id="rules"></div></div>` : ''}
    ${e.notes ? `<div class="panel"><h3>Findings</h3><div class="notes">${e.notes}</div></div>` : ''}`;
  if (e.rule) renderRules(e);
  const pickScen = i => { scen = i; tIdx = 0; renderExp(); };
  document.querySelectorAll('.sb, .oodrow').forEach(b => b.onclick = () => pickScen(+b.dataset.i));
  document.getElementById('gs').oninput = ev => { snapIdx = +ev.target.value; tIdx = 0; draw(); };
  document.getElementById('ts').oninput = ev => { tIdx = +ev.target.value; playing = false; document.getElementById('pl').textContent = 'Play'; draw(); };
  document.getElementById('pl').onclick = () => { playing = !playing; document.getElementById('pl').textContent = playing ? 'Pause' : 'Play'; };
  draw();
}

function drawGrid(id, str, W, H, colors, diffWith) {
  const cv = document.getElementById(id); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'), img = c.createImageData(W, H);
  const rgb = colors.map(h => { const x = h.replace('#', ''); return [parseInt(x.slice(0, 2), 16), parseInt(x.slice(2, 4), 16), parseInt(x.slice(4, 6), 16)]; });
  const bad = [214, 69, 69], ok = document.documentElement && matchMedia('(prefers-color-scheme: dark)').matches ? [42, 42, 39] : [238, 236, 230];
  for (let i = 0; i < W * H; i++) {
    let col;
    if (diffWith && str[i] !== diffWith[i]) col = bad;
    else {
      col = rgb[(diffWith || str).charCodeAt(i) - 48] || [255, 0, 255];
      if (diffWith) col = col.map((v, j) => Math.round(v * 0.25 + ok[j] * 0.75));
    }
    img.data[i * 4] = col[0]; img.data[i * 4 + 1] = col[1]; img.data[i * 4 + 2] = col[2]; img.data[i * 4 + 3] = 255;
  }
  c.putImageData(img, 0, 0);
}

function lineChart(svgId, series, opt) {
  const W = 520, H = 250, l = 46, r = 10, t = 10, b = 26, svg = document.getElementById(svgId);
  const all = series.flatMap(s => s.flat != null ? [s.flat] : s.pts.map(p => p[1])).filter(v => v != null && isFinite(v));
  const xs = series.flatMap(s => (s.pts || []).map(p => p[0]));
  if (!all.length) { svg.innerHTML = ''; return; }
  let lo = opt.lo != null ? opt.lo : Math.min(...all), hi = opt.hi != null ? opt.hi : Math.max(...all);
  if (hi === lo) hi = lo + 1;
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1;
  const X = v => l + (W - l - r) * (x1 === x0 ? 0 : (v - x0) / (x1 - x0)), Y = v => t + (H - t - b) * (1 - (v - lo) / (hi - lo));
  let h = '';
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; h += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--line')}"/><text x="${l - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
  h += `<text x="${(W + l) / 2}" y="${H - 6}" text-anchor="middle">${opt.xlabel}</text>`;
  series.forEach(s => {
    if (s.flat != null) { h += `<line x1="${l}" x2="${W - r}" y1="${Y(s.flat)}" y2="${Y(s.flat)}" stroke="${s.color}" stroke-dasharray="5 4" stroke-width="1.5"/>`; return; }
    const d = s.pts.filter(p => p[1] != null).map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    h += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2}" ${s.dash ? 'stroke-dasharray="4 3"' : ''}/>`;
  });
  if (opt.marker != null) h += `<line x1="${X(opt.marker)}" x2="${X(opt.marker)}" y1="${t}" y2="${H - b}" stroke="${css('--ink')}" stroke-dasharray="3 3"/>`;
  svg.innerHTML = h;
  document.getElementById(opt.legend).innerHTML = series.map(s => `<span><i class="sw" style="background:${s.color}"></i>${s.name}</span>`).join('');
}

function renderRules(e) {
  const R = e.rule, k = R.k, nt = R.nt, out = [];
  const pal = [css('--muted'), css('--bad'), css('--accent'), css('--good'), css('--warn')];
  const colorOf = j => { const c = e.states[j].color; return /^#e9e6dc$/i.test(c) ? css('--muted') : c; };
  for (let s = 0; s < k; s++) for (let t = 0; t < nt; t++) {
    const row = n => (s * nt + t) * 9 + n;
    const use = [...Array(9)].map((_, n) => R.usage[row(n)]);
    const total = use.reduce((a, b) => a + b, 0);
    if (!total) continue;
    const targets = [];
    for (let j = 0; j < k; j++) {
      if (j === s) continue;
      let mx = 0;
      for (let n = 0; n < 9; n++) if (use[n]) mx = Math.max(mx, R.truth[row(n) * k + j], R.learned[row(n) * k + j]);
      if (mx > 0.02) targets.push(j);
    }
    if (!targets.length) continue;
    const W = 240, H = 150, l = 30, r = 8, tp = 22, b = 22;
    const X = n => l + (W - l - r) * n / 8, Y = v => tp + (H - tp - b) * (1 - v);
    const maxUse = Math.max(...use);
    let h = `<text x="${l}" y="13" style="font-size:12px;fill:${css('--ink')};font-weight:600">From ${e.states[s].name}${nt > 1 ? ' · ' + R.terrain[t] : ''}</text>`;
    for (const v of [0, 0.5, 1]) h += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--line')}"/><text x="${l - 4}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
    for (let n = 0; n <= 8; n += 2) h += `<text x="${X(n)}" y="${H - 6}" text-anchor="middle">${n}</text>`;
    targets.forEach(j => {
      const c = colorOf(j);
      const pts = n => `${X(n).toFixed(1)},${Y(R.truth[row(n) * k + j]).toFixed(1)}`;
      h += `<polyline points="${[...Array(9)].map((_, n) => pts(n)).join(' ')}" fill="none" stroke="${c}" stroke-dasharray="4 3" stroke-width="1.5"/>`;
      const lp = [...Array(9)].map((_, n) => [X(n), Y(R.learned[row(n) * k + j])]);
      h += `<polyline points="${lp.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2" opacity="0.85"/>`;
      lp.forEach((p, n) => { const o = use[n] ? 0.15 + 0.85 * Math.log(1 + use[n]) / Math.log(1 + maxUse) : 0.08; h += `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${c}" opacity="${o.toFixed(2)}"/>`; });
    });
    const leg = targets.map(j => `<span><i class="sw" style="background:${colorOf(j)}"></i>→ ${e.states[j].name}</span>`).join('');
    out.push(`<div><svg viewBox="0 0 ${W} ${H}" width="100%">${h}</svg><div class="legend" style="margin-top:2px">${leg}</div></div>`);
  }
  document.getElementById('rules').innerHTML = out.join('') || '<div class="blurb">No rule data yet.</div>';
}

function draw() {
  const e = exp; if (!e) return;
  if (!e.ood || scen >= e.ood.length) scen = -1;
  const ood = scen >= 0 ? e.ood[scen] : null;
  const s = ood || e.snapshots[snapIdx], W = e.width, H = e.height, colors = e.states.map(x => x.color);
  document.getElementById('gs').disabled = !!ood;
  document.getElementById('genrow').style.opacity = ood ? 0.45 : 1;
  const sd = document.getElementById('scendesc');
  if (sd) sd.textContent = ood ? ood.desc + ' Showing the final evolved rule.' : 'A held-out outbreak of the same kind as the training data. Use the slider to step through generations.';
  document.getElementById('gl').textContent = ood ? `final rule · ${e.metric_name} ${fmt(ood.test)}` : (s ? `gen ${s.gen} · ${e.metric_name} ${fmt(s.test)}` : 'no snapshot yet');
  const ft = e.frame_times || [];
  document.getElementById('tl').textContent = ft.length ? `t = ${ft[tIdx]}` : '';
  document.getElementById('ts').value = tIdx;
  if (s) {
    drawGrid('cT', s.truth[tIdx], W, H, colors);
    drawGrid('cM', s.model[tIdx], W, H, colors);
    drawGrid('cD', s.model[tIdx], W, H, colors, s.truth[tIdx]);
    document.getElementById('cmcap').textContent = ood ? 'Evolved CA (final rule)' : `Evolved CA (generation ${s.gen})`;
  }
  const pal = [css('--accent'), css('--warn'), css('--bad'), css('--good'), css('--muted')];
  if (ood) {
    lineChart('lc', [
      { name: 'best rule (held-out)', color: css('--accent'), pts: e.history.map(h => [h.gen, h.test]) },
      ...(e.baselines || []).map((b, i) => ({ name: b.name, color: pal[(i + 1) % pal.length], flat: b.value }))
    ], { xlabel: 'generation', legend: 'lcl', lo: e.metric_lo, hi: e.metric_hi });
  } else
  lineChart('lc', [
    { name: 'best rule (held-out)', color: css('--accent'), pts: e.history.map(h => [h.gen, h.test]) },
    { name: 'best rule (train)', color: css('--muted'), w: 1.5, dash: true, pts: e.history.map(h => [h.gen, h.train]) },
    ...(e.baselines || []).map((b, i) => ({ name: b.name, color: pal[(i + 1) % pal.length], flat: b.value }))
  ], { xlabel: 'generation', legend: 'lcl', marker: s ? s.gen : null, lo: e.metric_lo, hi: e.metric_hi });
  if (s && s.curves) {
    const series = [];
    Object.entries(s.curves).forEach(([k, v], i) => series.push({ name: k, color: pal[i % pal.length], dash: k.toLowerCase().includes('truth') ? false : true, w: k.toLowerCase().includes('truth') ? 2.5 : 2, pts: v.map((y, j) => [j, y]) }));
    lineChart('cv', series, { xlabel: 'time step', legend: 'cvl', lo: 0, marker: ft[tIdx] });
  }
}

setInterval(() => {
  if (!playing || !exp || !(exp.frame_times || []).length) return;
  tIdx = (tIdx + 1) % exp.frame_times.length; draw();
}, 350);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => exp && renderExp());
poll();
</script>
</body>
</html>
